# .github/workflows/push-to-scalar-registry.yml
name: Check OpenAPI Spec
on:
  pull_request:
    # Omitting the branches block means it applies to PRs against any branch
    paths:
      - 'openapi.json'

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Validate OpenAPI Document
        run: npm run validate
